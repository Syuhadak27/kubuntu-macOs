# Kubuntu-macOS default settings
# This file is sourced by the installer. Keep values shell-quote safe.

KM_PROJECT_NAME="Kubuntu-macOS"
KM_VERSION="1.0.0"
KM_MIN_PLASMA5_MINOR=24
KM_MIN_FREE_MB=1536
KM_APPEARANCE_DEFAULT="light"

# WhiteSur component names
KM_THEME_LIGHT="WhiteSur"
KM_THEME_DARK="WhiteSur-dark"
KM_LOOKFEEL_LIGHT="com.github.vinceliuice.WhiteSur"
KM_LOOKFEEL_DARK="com.github.vinceliuice.WhiteSur-dark"
KM_COLOR_LIGHT="WhiteSur"
KM_COLOR_DARK="WhiteSurDark"
KM_ICON_THEME="WhiteSur"
KM_CURSOR_THEME="WhiteSur-cursors"
KM_KVANTUM_LIGHT="WhiteSur"
KM_KVANTUM_DARK="WhiteSurDark"
KM_AURORAE_LIGHT="WhiteSur"
KM_AURORAE_DARK="WhiteSur-dark"

# Panel geometry
KM_TOP_PANEL_HEIGHT=30
KM_DOCK_HEIGHT=64
KM_PANEL_OPACITY="translucent"

# Default dock launchers. preferred:// entries are resolved by Plasma.
KM_DOCK_LAUNCHERS=(
  "preferred://filemanager"
  "preferred://browser"
  "applications:org.kde.konsole.desktop"
  "applications:systemsettings.desktop"
)

# Inter is a freely licensed (SIL OFL) font that resembles the macOS UI face.
# Apple SF Pro is intentionally not bundled or downloaded.
KM_FONT_FAMILY="Inter"
KM_FONT_STRING="Inter,10,-1,5,50,0,0,0,0,0"

# Window buttons: Minimize, Maximize, Close from left to right.
# KWin letters: I=Minimize, A=Maximize, X=Close.
KM_BUTTONS_RIGHT="IAX"
KM_BUTTONS_LEFT=""

# Window decoration engine. Aurorae is the SVG-based engine WhiteSur uses.
KM_DECO_LIBRARY="org.kde.kwin.aurorae"

# Cursor size in pixels.
KM_CURSOR_SIZE=24

# Inter font download source (OFL licensed, free to redistribute).
KM_INTER_URL="https://github.com/rsms/inter/releases/download/v4.0/Inter-4.0.zip"
