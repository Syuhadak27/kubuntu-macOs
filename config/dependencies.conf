# Dependency information used by scripts/check-system.sh and scripts/install-deps.sh.
# Package names target Ubuntu/Kubuntu. The installer only installs packages that
# are actually missing and only after the user approves the sudo operation.

KM_CORE_COMMANDS=(bash git curl tar gzip python3 sha256sum flock awk sed grep find mktemp install cp mv rm chmod stat)
KM_CORE_PACKAGES=(git curl tar gzip python3 coreutils util-linux)

# Plasma 5 tools
KM_PLASMA5_CONFIG_PACKAGE="kdelibs5-plugins"
KM_PLASMA5_KVANTUM_PACKAGE="qt5-style-kvantum"
# Plasma 6 tools
KM_PLASMA6_CONFIG_PACKAGE="kf6-kconfig-bin"
KM_PLASMA6_KVANTUM_PACKAGE="qt6-style-kvantum"

# OFL licensed UI font. Optional.
KM_FONT_PACKAGE="fonts-inter"
